<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class = "container">
    <div class = "profile-card">
      <div class = "profile-picture">
        <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class = "profile-img">
      </div>
      <h1>Jessica Randall</h1>
      <p class = "localization">London, United Kingdom</p>
      <p class = "bio">"Front-end developer and avid reader."</p>
    </div>  

    <ul class="social-links">
      <li><button class="btn" href="#">GitHub</button></li>
      <li><button class="btn" href="#">Frontend Mentor</button></li>
      <li><button class="btn" href="#">LinkedIn</button></li>
      <li><button class="btn" href="#">Twitter</button></li>
      <li><button class="btn" href="#">Instagram</button></li>
    </ul>
  </div>

  
  
  <footer class="attribution">
    <div>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Victória Nascimento</a>.
    </div> 
  </footer>
</body>
</html>
